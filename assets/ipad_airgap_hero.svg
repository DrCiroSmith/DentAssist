<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t5 d5">
  <title id="t5">DentAssist Air-Gapped Clinical Tablet Interface</title>
  <desc id="d5">Clinical iPad tablet UI with dental panoramic radiograph arch, periapical ROI bounding boxes, offline MedGemma 4B token stream, and verified zero-socket badge.</desc>
  <style>
    .bg { fill: #0B111A; }
    .tablet-bezel { fill: #131B26; stroke: #334155; stroke-width: 2; }
    .screen-bg { fill: #070B11; }
    .panel { fill: #131B26; stroke: #233142; stroke-width: 1.2; }
    .sub-card { fill: #1A2536; stroke: #2A3B50; stroke-width: 1; }
    .txt-main { fill: #F1F5F9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .txt-sub { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .txt-mono { fill: #38BDF8; font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    
    .scan-beam { animation: scanMove 4s ease-in-out infinite alternate; }
    .roi-box { stroke: #EF4444; stroke-width: 1.5; stroke-dasharray: 4 2; fill: #EF4444; fill-opacity: 0.12; }
    .pulse-badge { animation: pulseBadge 2s ease-in-out infinite alternate; }
    
    @keyframes scanMove { 0% { transform: translateX(0px); opacity: 0.2; } 100% { transform: translateX(520px); opacity: 0.8; } }
    @keyframes pulseBadge { 0% { opacity: 0.5; } 100% { opacity: 1; } }

    @media (prefers-color-scheme: light) {
      .bg { fill: #F8FAFC; }
      .tablet-bezel { fill: #FFFFFF; stroke: #CBD5E1; }
      .screen-bg { fill: #F1F5F9; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; }
      .sub-card { fill: #F8FAFC; stroke: #E2E8F0; }
      .txt-main { fill: #0F172A; }
      .txt-sub { fill: #475569; }
      .txt-mono { fill: #0284C7; }
    }
  </style>

  <rect width="1200" height="480" rx="16" class="bg"/>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="15.5" fill="none" stroke="#334155" stroke-opacity="0.3"/>

  <!-- Header -->
  <g transform="translate(50, 24)">
    <text x="0" y="24" class="txt-main" font-size="18" font-weight="700">DENTASSIST: AIR-GAPPED ON-DEVICE CLINICAL COPILOT</text>
    <text x="0" y="44" class="txt-sub" font-size="12">16-Bit Radiograph ROI Detection · Local MedGemma 4B MLC-LLM · Verifiable 0.0.0.0 Air-Gap</text>
  </g>

  <!-- Left: iPad Tablet Mockup -->
  <g transform="translate(50, 85)">
    <rect width="650" height="360" rx="22" class="tablet-bezel"/>
    <circle cx="20" cy="180" r="4" fill="#475569"/>
    
    <!-- Inner Screen -->
    <g transform="translate(38, 20)">
      <rect width="580" height="320" rx="8" class="screen-bg"/>
      
      <!-- Top Screen Bar -->
      <g transform="translate(16, 16)">
        <text x="0" y="14" class="txt-mono" font-size="11" font-weight="700">PANORAMIC ARCH STUDY #D-4091</text>
        <text x="430" y="14" class="txt-mono" font-size="10" fill="#10B981">16-BIT GRAYSCALE</text>
        <line x1="0" y1="24" x2="548" y2="24" stroke="#334155" stroke-width="0.75"/>
      </g>

      <!-- Stylized Vector Dental Panoramic Arch -->
      <g transform="translate(20, 55)">
        <path d="M 40 80 C 120 20, 420 20, 500 80" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
        <path d="M 40 160 C 120 220, 420 220, 500 160" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Tooth Contours -->
        <g fill="#94A3B8" opacity="0.75">
          <rect x="70" y="130" width="22" height="30" rx="4"/>
          <rect x="110" y="140" width="24" height="32" rx="4"/>
          <rect x="150" y="155" width="24" height="34" rx="4"/>
          <rect x="190" y="170" width="20" height="34" rx="4"/>
          <rect x="230" y="180" width="16" height="35" rx="3"/>
          <rect x="250" y="182" width="16" height="35" rx="3"/>
          <rect x="274" y="182" width="16" height="35" rx="3"/>
          <rect x="294" y="180" width="16" height="35" rx="3"/>
          <rect x="330" y="170" width="20" height="34" rx="4"/>
          <rect x="366" y="155" width="24" height="34" rx="4"/>
          <rect x="406" y="140" width="24" height="32" rx="4"/>
          <rect x="446" y="130" width="22" height="30" rx="4"/>
        </g>

        <!-- ROI Callout 1 -->
        <g transform="translate(100, 125)">
          <rect width="44" height="55" rx="4" class="roi-box"/>
          <text x="0" y="-8" class="txt-mono" font-size="10" font-weight="700" fill="#EF4444">#19 Lucency</text>
        </g>

        <!-- ROI Callout 2 -->
        <g transform="translate(396, 125)">
          <rect width="44" height="55" rx="4" class="roi-box"/>
          <text x="0" y="-8" class="txt-mono" font-size="10" font-weight="700" fill="#EF4444">#30 Margin</text>
        </g>

        <!-- Animated Scanner Beam -->
        <g class="scan-beam">
          <line x1="20" y1="20" x2="20" y2="210" stroke="#38BDF8" stroke-width="2"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Right: Air-Gap Badge & Local LLM Telemetry -->
  <g transform="translate(730, 85)">
    <!-- Security Air-Gap Badge Card -->
    <rect width="420" height="130" rx="12" class="panel"/>
    <g transform="translate(24, 24)">
      <rect width="372" height="36" rx="8" fill="#10B981" fill-opacity="0.15"/>
      <circle cx="20" cy="18" r="6" fill="#10B981" class="pulse-badge"/>
      <text x="36" y="22" fill="#10B981" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700">0.0.0.0 AIR-GAP VERIFIED</text>
      
      <text x="0" y="58" class="txt-main" font-size="13" font-weight="600">Zero Cloud Transmission Guarantee</text>
      <text x="0" y="78" class="txt-sub" font-size="11">AF_INET Sockets Inactive · DoD 5220.22-M Memory Erasure</text>
    </g>

    <!-- Local Inference Diagnostics Card -->
    <g transform="translate(0, 150)">
      <rect width="420" height="210" rx="12" class="panel"/>
      <text x="24" y="32" class="txt-main" font-size="14" font-weight="700">LOCAL MedGemma 4B INFERENCE</text>

      <g transform="translate(24, 52)">
        <rect width="372" height="135" rx="8" class="sub-card"/>
        <text x="14" y="24" class="txt-mono" font-size="11" fill="#38BDF8">&gt; Differential Diagnostic Assessment:</text>
        <text x="14" y="46" class="txt-main" font-size="11">1. Tooth #19: Periapical radiolucency (4.2mm).</text>
        <text x="14" y="66" class="txt-sub" font-size="11">Recommended: Vitality testing (cold/electric).</text>
        <text x="14" y="90" class="txt-mono" font-size="10" fill="#10B981">Throughput: 42.6 tok/s · Latency: 23ms TTFT</text>
        <text x="14" y="112" class="txt-mono" font-size="10" fill="#94A3B8">Engine: MLC-LLM C++ FFI Bridge · 4-Bit Quant</text>
      </g>
    </g>
  </g>
</svg>