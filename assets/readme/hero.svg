    <circle cx="16" cy="13" r="4" fill="#10B981"/>
    <text x="30" y="17" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">ON-DEVICE MULTIMODAL MEDICAL AI</text>
