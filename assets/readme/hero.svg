    <text x="800" y="40" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">1-Tap AES Secure Wipe</text>
  </g>

  <!-- Tech Badges -->
  <g transform="translate(60, 236)">
